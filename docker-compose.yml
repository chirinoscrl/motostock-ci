services:
  mongo:
    image: mongo:7
    container_name: motostock-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - motostock-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motostock-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/motostock
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - motostock-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser runs on the host, so it reaches the backend via localhost.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: motostock-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - motostock-net

networks:
  motostock-net:
    driver: bridge

volumes:
  mongo-data:
